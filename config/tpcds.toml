# Transfer test: time released versions on TPC-DS, which the loop never optimised for.
# Same as default.toml except [workload]. Run: bin/dbe --config config/tpcds.toml transfer --run sf10
# db_evolve configuration. All paths are relative to the project root.

[project]
work_dir = "work"        # clones, builds, data, artifacts (large, regenerable)
runs_dir = "runs"        # one directory per evolution run (ledger, experiments)
results_dir = "results"  # release evaluations and plots

[engine]
name = "duckdb"
repo = "https://github.com/duckdb/duckdb"
base_ref = "v1.5.6"                 # v0: the engine we start evolving from
version_override = "v1.5.6"         # keeps the reported version stable across candidates
build_jobs = 8
extensions = ["tpch"]               # linked into every build (data generation needs it)
# A candidate may only touch files under these prefixes ...
editable_paths = ["src/", "extension/parquet/", "extension/core_functions/"]
# ... and never these, even if they fall under an editable prefix.
forbidden_paths = ["test/", "benchmark/", "tools/", "scripts/", "extension/tpch/", "extension/tpcds/", ".github/"]
max_diff_lines = 4000

[workload]
name = "tpcds"
seed = 20261116
train_templates = 0                 # transfer test: every template is held out
val_templates = 0
test_templates = 99
instances_per_template = 1          # the 99 queries have fixed spec-default parameters
heldout_bindings = 0

[datasets.main]                     # timing + correctness
scale_factor = 10.0                 # SF 1 queries (20-120 ms) were too short to time reliably
[datasets.shadow]                   # correctness only: different data, catches data-specific shortcuts
scale_factor = 1.0

[bench]
threads = 8
warmup_runs = 1
timed_runs = 3
statement_timeout_s = 300
# Interleaving order of the two binaries (A = incumbent, B = candidate); each letter is one full pass.
ab_order = "ABBA"
retime_order = "BAAB"                # extra passes for a borderline result, decided on all 8 together

[bar]                                # the acceptance bar, fixed before anything is measured
rule = "templates"                   # "templates" (per-template, noise-aware) or "geomean" (original)
min_template_gain = 0.05             # templates rule: an improved template is >= 5 % faster ...
max_geomean_regression = 0.0         # templates rule: the visible geomean may not get slower
min_gain = 0.02                      # geomean rule: >= 2 % faster on the train geomean ...
noise_multiplier = 1.5               # ... both thresholds are at least 1.5x each template's worst A/A deviation
                                     # (already a tail estimate: the max over 4 repeats)
max_template_regression = 0.05       # no template slower by more than 5 % ...
abs_slack_ms = 5.0                   # ... or 5 ms, whichever is larger
val_tolerance = 0.02                 # hidden validation geomean may not get more than 2 % slower

[agents]
backend = "claude-cli"               # or "mock" (no model calls; exercises the pipeline)
model = "claude-opus-5-5"
planner_budget_usd = 4.0
implementer_budget_usd = 15.0
reviewer_budget_usd = 3.0
max_total_usd = 0                    # hard stop for the whole run in dollars; 0 = no limit
timeout_s = 5400
max_fix_attempts = 2                 # implementer retries after a failed gate or a rejected review

[loop]
generations = 3                      # releases v1..v3
rounds_per_generation = 6
experiments_per_round = 1

[report]
passes = 4                           # full passes per version, alternating direction
